[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrym-hardware-store"
version = "0.2.0"
description = "The Matrym Labs Hardware Store: the fleet's certified catalog of reusable engineering capability."
requires-python = ">=3.11"
# Zero runtime dependencies by design: cards are TOML (stdlib tomllib),
# the index is JSON (stdlib json). Dependencies earn their place; none has yet.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "ruff==0.16.1", "mypy==2.3.0"]

# The Store is an outward-facing dependency: a stream installs it and runs these
# verbs in CI. Console scripts are the consume-first / integrity surface.
[project.scripts]
store-check = "hardware_store.store_check:main"
store-search = "hardware_store.store_search:main"
store-consume = "hardware_store.consume:main"
store-promote = "hardware_store.promote:main"
store-consume-first = "hardware_store.consume_first:main"

[tool.setuptools]
packages = ["hardware_store"]

[tool.setuptools.package-data]
hardware_store = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
# The catalogue is collected too. It was not, and for a year the Store's gate reported PASS while
# running none of the 103 contract tests that define what its Parts promise. `retry`,
# `typed-settings` and `circuit-breaker` were CERTIFIED and consumed by real repositories on the
# strength of contracts CI had never executed.
#
# importlib import mode is what makes that possible: every Part names its test file
# `test_contract.py` by convention, and the legacy prepend mode resolves all of them to one module
# name and collides. Scoping the gate down to `tests/` hid that collision instead of solving it.
testpaths = ["tests", "catalog"]
addopts = "--import-mode=importlib"
# Fixtures are mini-Stores exercised via store_check, never collected directly.
norecursedirs = ["fixtures", ".venv", "build"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["hardware_store"]  # the tool's typed surface (matches the Makefile; catalog/ is reference impls)
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/fixtures"]
