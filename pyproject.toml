[project]
name = "matrym-hardware-store"
version = "0.1.0"
description = "The Matrym Labs Hardware Store: the fleet's certified catalog of reusable engineering capability."
requires-python = ">=3.11"
# Zero runtime dependencies by design: cards are TOML (stdlib tomllib),
# the index is JSON (stdlib json). Dependencies earn their place; none has yet.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fixtures are mini-Stores exercised via store_check, never collected directly.
norecursedirs = ["fixtures", ".venv", "build"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/fixtures"]
