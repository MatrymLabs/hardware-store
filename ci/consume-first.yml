# Drop-in consume-first gate for a stream repo (codeforge, ai-log-triage, FGL).
# Copy this into the stream's .github/workflows/. It fails a PR that reimplements
# a catalogued capability without a logged store_search or a DECISION: override.
#
# It pins the Hardware Store TWICE at the same version: the tool via pip
# (store-consume-first), and the catalog index via the tag's raw registry.json.
# Bump STORE_VERSION to adopt a newer catalog.
name: consume-first

on:
  pull_request:

env:
  STORE_VERSION: v0.2.0

jobs:
  consume-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0                       # need the merge base for the diff
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"
      - name: install the Hardware Store tool (pinned)
        run: pip install "matrym-hardware-store @ git+https://github.com/MatrymLabs/hardware-store@${STORE_VERSION}"
      - name: fetch the catalog index at the same pin
        run: curl -sSfL "https://raw.githubusercontent.com/MatrymLabs/hardware-store/${STORE_VERSION}/registry.json" -o store-registry.json
      - name: compute changed files
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          echo "files=$(git diff --name-only "$base"...HEAD -- '*.py' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # The search log is REPO-LOCAL and committed: developers record their looks with
      #   store-search "<capability>" --repo <this-repo> --log-file .hardware-store/search_log.jsonl
      # and commit .hardware-store/search_log.jsonl. That is the "prove you looked" record.
      - name: consume-first gate
        run: |
          store-consume-first \
            --registry store-registry.json \
            --search-log .hardware-store/search_log.jsonl \
            --repo "${{ github.event.repository.name }}" \
            --changed ${{ steps.diff.outputs.files }}
