name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: typecheck
        run: mypy hardware_store
      - name: test
        run: pytest -q
      - name: store-check (integrity gate)
        run: store-check
