name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: typecheck
        run: mypy hardware_store
      - name: test
        run: pytest -q
      - name: store-check (integrity gate)
        run: store-check --no-fleet
