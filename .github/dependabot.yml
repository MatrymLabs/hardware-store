# Dependabot -- automated dependency vulnerability + version monitoring.
# Supply-chain hygiene (NIST SSDF RV, EO 14028): a bot watches deps so a known
# CVE surfaces as a PR, not a surprise. Bumps are reviewed like any change
# (branch -> CI green -> merge); Dependabot never merges on its own.
#
# Fleet gate standard rule 3: the ecosystem must match what the repo actually uses.
# codeforge declared "pip" beside a uv.lock that CI validates, so every dependency PR
# the bot opened failed on arrival (codeforge #873). Check before copying this file.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "security"

  # The CI/CD workflow actions themselves (pinned action versions age out).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Rule 4. codeql-action's init, analyze and upload-sarif are ONE action published
      # from one repo, and they refuse to run at different versions:
      #   "Loaded a configuration file for version '4.37.6', but running version '4.37.5'"
      # Ungrouped, Dependabot opens a PR per sub-action; each is red alone, and merging
      # any one of them turns main red (codeforge #857, grouped in #884). Together or not
      # at all. Grouped from day one here so this repo never learns it the expensive way.
      codeql-action:
        patterns:
          - "github/codeql-action*"
